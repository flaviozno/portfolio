    <script>
      (() => {
        try {
          const saved = localStorage.getItem('portfolio-theme');
          const savedMotion = localStorage.getItem('portfolio-motion');
          const theme = saved === 'light' || saved === 'dark' ? saved : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.dataset.theme = theme;
          document.documentElement.dataset.motion = savedMotion === 'reduced' ? 'reduced' : 'full';
        } catch {
          document.documentElement.dataset.theme = 'light';
          document.documentElement.dataset.motion = 'full';
        }
      })();
    </script>
